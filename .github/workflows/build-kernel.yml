name: Build Kenzo Kernel (Google GCC 4.9)

on:
  workflow_dispatch:

env:
  TOOLCHAIN_URL: https://github.com

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev tcl \
        bison flex libelf-dev git zip ccache cpio

    - name: Clone Google GCC 4.9
      run: |
        git clone --depth=1 "$TOOLCHAIN_URL" $GITHUB_WORKSPACE/gcc49

    - name: Compile Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=$GITHUB_WORKSPACE/gcc49/bin/aarch64-linux-android-

        make O=out kenzo_defconfig
        scripts/config --file out/.config --disable CONFIG_EARLY_PRINTK
        make -j3 O=out

    - name: Pack with AnyKernel3
      run: |
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        cd AnyKernel3
        zip -r9 ../Kenzo-Kernel-Software-Keystore.zip * -x .git README.md

    - name: Upload Finished Kernel
      uses: actions/upload-artifact@v4
      with:
        name: Kenzo_Kernel
        path: Kenzo_Kernel.zip
