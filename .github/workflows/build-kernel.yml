name: Build Kenzo Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install Build Dependencies
      run: |
        sudo apt-get update --fix-missing
        sudo apt-get install -y --fix-missing bc build-essential libncurses5-dev libssl-dev tcl \
        bison flex libelf-dev git zip ccache cpio

    - name: Setup Google Android NDK (Clang/LLVM)
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r21e
        add-to-path: false

    - name: Compile Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        
        export TOOLCHAIN_DIR="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64"
        export PATH="$TOOLCHAIN_DIR/bin:$PATH"
        export CROSS_COMPILE=aarch64-linux-android-
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export KCFLAGS="-fno-integrated-as -D__ASM_GENERIC_STAT64 -w"
        export KCPPFLAGS="-D__ASM_GENERIC_STAT64"
        export EXTRA_CFLAGS="-D__ASM_GENERIC_STAT64"
        export MAKE_FLAGS="CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip LD=ld.lld KCFLAGS=-D__ASM_GENERIC_STAT64 KCPPFLAGS=-D__ASM_GENERIC_STAT64 EXTRA_CFLAGS=-D__ASM_GENERIC_STAT64"
                
        make O=out $MAKE_FLAGS kenzo_defconfig
        make -j3 O=out $MAKE_FLAGS

    - name: Pack with AnyKernel3
      run: |
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        cd AnyKernel3
        zip -r9 ../Kenzo-Kernel.zip * -x .git README.md

    - name: Upload Finished Kernel
      uses: actions/upload-artifact@v4
      with:
        name: Kenzo-Kernel
        path: Kenzo-Kernel.zip
