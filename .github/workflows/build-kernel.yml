name: Build Kenzo Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install Build Dependencies
      run: |
        sudo apt-get update --fix-missing
        sudo apt-get install -y --fix-missing bc build-essential libncurses5-dev libssl-dev tcl \
        bison flex libelf-dev git zip ccache cpio

    - name: Setup Google Android NDK (GCC 4.9)
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r16b
        add-to-path: false

    - name: Compile Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        
        export CROSS_COMPILE="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/aarch64-linux-android-4.9/prebuilt/linux-x86_64/bin/aarch64-linux-android-"
        
        make O=out kenzo_defconfig
        make -j3 O=out

    - name: Pack with AnyKernel3
      run: |
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        cd AnyKernel3
        zip -r9 ../Kenzo-Kernel.zip * -x .git README.md

    - name: Upload Finished Kernel
      uses: actions/upload-artifact@v4
      with:
        name: Kenzo-Kernel
        path: Kenzo-Kernel.zip
